name: Training Data Preparation

on:
  schedule:
    # Every Sunday at 1:00 AM UTC (before training_pipeline at 2:00 AM)
    - cron: "0 1 * * 0"
  workflow_dispatch:

jobs:
  training-data-prep:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug environment
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -z "$MONGODB_URI" ]; then
            echo " ERROR: MONGODB_URI secret is NOT set in GitHub repository!"
            echo "Go to: https://github.com/Fatiha-maryam/Islamabad_aqi_prediction/settings/secrets/actions"
            echo "Add secret name: MONGODB_URI"
            echo "Add secret value: your_mongodb_connection_string"
            exit 1
          else
            echo " MONGODB_URI secret is configured"
            echo "First 20 chars: ${MONGODB_URI:0:20}..."
          fi

      - name: Run training data preparation
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DB_NAME: islamabad_aqi
        run: python src/training_data_preparation.py
